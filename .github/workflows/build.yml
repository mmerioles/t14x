name: Teensy build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Python tests and generated-file drift
        run: uv run python -m unittest discover -s tests -v

      - name: Native firmware logic tests
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware tests/keyboard_core_test.c firmware/keyboard_core.c firmware/keymap.c -o build/keyboard_core_tests
          ./build/keyboard_core_tests
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware tests/mouse_core_test.c firmware/mouse_core.c -o build/mouse_core_tests
          ./build/mouse_core_tests
          uv run python tools/generate.py --check

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Build Teensy 4.1 firmware
        run: |
          uvx --from platformio pio run
          cp .pio/build/keyboard/firmware.hex build/t14_keyboard.hex
          cp .pio/build/diagnostics/firmware.hex build/t14_diagnostics.hex

      - uses: actions/upload-artifact@v4
        with:
          name: t14-teensy41-firmware
          path: |
            build/t14_keyboard.hex
            build/t14_diagnostics.hex
