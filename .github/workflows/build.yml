name: Pico Compile Check

on:
  push:
  pull_request:

env:
  PICO_SDK_PATH: /opt/pico-sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential git python3-tk

      - name: Test diagnostic mapping
        run: python3 -m unittest discover -s tests -v

      - name: Test keyboard core
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware tests/keyboard_core_test.c firmware/keyboard_core.c firmware/keymap.c -o build/keyboard_core_tests
          ./build/keyboard_core_tests
          python3 tools/generate_keymap.py --check

      - name: Install Pico SDK
        run: |
          sudo git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git $PICO_SDK_PATH
          sudo chown -R $USER:$USER $PICO_SDK_PATH
          cd $PICO_SDK_PATH
          git submodule update --init

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: t14-firmware
          path: |
            build/t14_keyboard.uf2
            build/t14_diagnostics.uf2
