; Teensy 4.1 firmware. Build both: pio run   Output: .pio/build/<env>/firmware.hex
[platformio]
src_dir = firmware

[env]
platform = teensy@6.0.0
board = teensy41
framework = arduino
build_src_flags = -Wall -Wextra -Werror

[env:keyboard]
build_flags = -D USB_HID
build_src_filter = +<*> -<diagnostics_main.cpp>

[env:diagnostics]
build_flags = -D USB_SERIAL -D T14_DIAGNOSTICS
build_src_filter = +<*> -<keyboard_main.cpp> -<keyboard_core.c> -<keymap.c>
