[project]
name = "t14-diagnostics"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pyserial==3.5"]

[project.scripts]
diagnostics = "diagnostics.__main__:main"

[tool.uv]
# uv's own Python builds include Tk on every OS; system Pythons often lack it.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "diagnostics"
module-root = ""

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
